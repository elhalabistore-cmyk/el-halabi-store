name = "el-halabi-store"
main = "worker.js"
compatibility_date = "2026-11-22"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*", "/media/*"]

[[d1_databases]]
binding = "DB"
database_name = "el-halabi-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

