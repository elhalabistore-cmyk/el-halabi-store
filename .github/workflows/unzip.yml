name: Extract Store Files

on:
  push:
    paths:
      - 'el-halabi-cloudflare-free-no-r2.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o el-halabi-cloudflare-free-no-r2.zip -d extracted
          cp -a extracted/. .
          rm -rf extracted
          rm el-halabi-cloudflare-free-no-r2.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract store project" || exit 0
          git push
